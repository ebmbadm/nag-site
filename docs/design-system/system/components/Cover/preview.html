<!doctype html>
<html lang="ru">
<head>

<title>NAG · NOVIK</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }

  .deep { fill: var(--ink); }
  .brand { fill: var(--accent); }
  .tint { fill: var(--line-strong); }
  .mid { fill: var(--ink-2); }
  .blk { rx: var(--radius-sm); }
  .cut { fill: var(--bg); rx: var(--radius-sm); }
  .words { position: absolute; left: var(--space-6); right: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .95; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }

<div class="cover">
