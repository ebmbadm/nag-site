<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root" class="nag-demo"></div>
<script>
  var N = window.Nag, h = React.createElement;
  var names = ['arrow-right', 'chevron-down', 'download', 'file-text', 'search', 'wifi', 'phone', 'check', 'x', 'info', 'triangle-alert', 'circle-x', 'scissors', 'plus', 'minus'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    names.map(function (n) { return h('span', { key: n, title: n, style: { display: 'inline-flex', flexDirection: 'column', alignItems: 'center', gap: '6px', width: '88px', fontSize: '12px', color: 'var(--ink-3)' } }, h(N.Icon, { name: n }), n); })));
</script>
</body>
</html>
