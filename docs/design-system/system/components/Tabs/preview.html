<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Tabs</title></head>
<body>
<div id="root" class="nag-demo nag-demo--col"></div>
<script>
  var N = window.Nag, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(N.Tabs, { items: [{ label: 'Характеристики', current: true }, { label: 'Фото' }, { label: 'Документы' }, { label: 'Другие усилители' }] }),
    h(N.Tabs, { density: 'app', label: 'Разделы канала', items: [{ label: 'Фильтры и эквалайзер', current: true }, { label: 'Задержка и полярность' }, { label: 'Лимитер' }] })));
</script>
</body>
</html>
